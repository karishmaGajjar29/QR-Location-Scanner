<!-- Styled Main Header Toolbar -->
<mat-toolbar class="main-toolbar">
  <div class="toolbar-content">
    <div class="logo-box">
      <mat-icon class="logo-icon">location_on</mat-icon>
      <span class="logo-title">PinPoint QR</span>
      <span class="logo-badge">Studio</span>
    </div>
    <span class="toolbar-spacer"></span>
    <span class="toolbar-tagline">Google Maps Location Tool</span>
  </div>
</mat-toolbar>

<!-- Main Tab View Container -->
<div class="app-content-wrapper">
  <mat-tab-group mat-stretch-tabs="false" mat-align-tabs="center" class="main-tab-group" animationDuration="400ms">
    
    <!-- Tab 1: QR Code Generator -->
    <mat-tab>
      <ng-template mat-tab-label>
        <mat-icon class="tab-icon">add_location_alt</mat-icon>
        <span class="tab-label-text">Generate QR Code</span>
      </ng-template>
      <div class="tab-pane-container">
        <app-qr-location-generator></app-qr-location-generator>
      </div>
    </mat-tab>

    <!-- Tab 2: QR Code Scanner -->
    <mat-tab>
      <ng-template mat-tab-label>
        <mat-icon class="tab-icon">qr_code_scanner</mat-icon>
        <span class="tab-label-text">Scan QR Code</span>
      </ng-template>
      <div class="tab-pane-container">
        <app-qr-location-scanner></app-qr-location-scanner>
      </div>
    </mat-tab>

  </mat-tab-group>
</div>

<!-- Simple Modern Footer -->
<footer class="app-footer">
  <p>PinPoint QR Code Location System &bull; Built with Angular, CSS Gradients, and Open Maps API</p>
</footer>
